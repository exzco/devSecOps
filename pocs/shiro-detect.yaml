id: shiro-detect

info:
  name: Apache Shiro Detection
  author: pdteam
  severity: info
  description: Apache Shiro framework was detected, check if default key is used.
  tags: tech,shiro,java,web

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "rememberMe=deleteMe"

      - type: status
        status:
          - 200
          - 301
          - 302
          - 403
