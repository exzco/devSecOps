id: env-file-exposure

info:
  name: Env File Exposure
  author: geeknik,pdteam
  severity: high
  description: |
    An .env file containing sensitive environment variables (such as database credentials, API keys) was detected.
  tags: config,exposure,env,vuln,web

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "DB_HOST="
          - "DB_PASSWORD="
          - "APP_ENV="
          - "AWS_ACCESS_KEY_ID="
        condition: or

      - type: status
        status:
          - 200
